<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0070F3"/>
      <stop offset="100%" style="stop-color:#00C4CC"/>
    </linearGradient>
  </defs>

  <!-- Background with iOS rounded corners -->
  <rect width="180" height="180" rx="40" fill="url(#grad)"/>

  <!-- Inner ring -->
  <rect x="20" y="20" width="140" height="140" rx="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Y letter - simplified and bold -->
  <g fill="white">
    <!-- Left arm -->
    <polygon points="45,45 65,45 90,82 90,95 70,95 70,88 45,45"/>
    <!-- Right arm -->
    <polygon points="135,45 115,45 90,82 90,95 110,95 110,88 135,45"/>
    <!-- Vertical stem -->
    <rect x="75" y="90" width="30" height="50" rx="4"/>
  </g>

  <!-- Dot accent -->
  <circle cx="140" cy="140" r="12" fill="white" opacity="0.9"/>
  <circle cx="140" cy="140" r="6" fill="url(#grad)"/>
</svg>
