<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient principal bleu → cyan -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0070F3"/>
      <stop offset="100%" style="stop-color:#00C4CC"/>
    </linearGradient>

    <!-- Ombre portée subtile -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0070F3" flood-opacity="0.3"/>
    </filter>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle avec gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Inner subtle ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Lettre Y stylisée - design géométrique moderne -->
  <g fill="white" filter="url(#glow)">
    <!-- Branche gauche du Y -->
    <path d="
      M 148 140
      L 200 140
      L 256 220
      L 256 260
      L 204 260
      L 204 240
      L 148 140
    "/>

    <!-- Branche droite du Y -->
    <path d="
      M 364 140
      L 312 140
      L 256 220
      L 256 260
      L 308 260
      L 308 240
      L 364 140
    "/>

    <!-- Barre verticale du Y -->
    <rect x="216" y="250" width="80" height="130" rx="8"/>
  </g>

  <!-- Point/accent moderne (représente le code/tech) -->
  <circle cx="380" cy="380" r="32" fill="white" opacity="0.9"/>
  <circle cx="380" cy="380" r="16" fill="url(#grad)"/>
</svg>
